name: Terraform Apply

on:
  pull_request:
    branches: [ "prod" ]
    paths:
      - 'fast/stages/0-org-setup/**'
  push:                               
    branches: [ "prod" ]              
    paths:                            
      - 'fast/stages/0-org-setup/**' 
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest

    # Set the working directory for ALL 'run' steps in this job
    defaults:
      run:
        working-directory: fast/stages/0-org-setup

    steps:
      - uses: actions/checkout@v4

      - id: 'auth'
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: 'projects/155157708409/locations/global/workloadIdentityPools/default/providers/github-default'
          service_account: 'iac-org-cicd-rw@rjh01-prod-iac-core-0.iam.gserviceaccount.com'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        # copy the apply (RW) provider and variables files into place
        cp datasets/classic/0-org-setup-providers-rw.tf providers.tf || true
        cp datasets/classic/auto.tfvars.json 0-org-setup.auto.tfvars.json || true
        run: terraform init -input=false

      # Run Plan for PRs to verify changes before merge
      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color

      # Run Apply ONLY after the PR is merged (triggered by push event)
      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
        run: |
          terraform apply -auto-approve